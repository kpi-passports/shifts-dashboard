<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="googlebot" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>التقرير التشغيلي لقياس تميز المناوبات — نسخة عرض</title>
<style>
:root{
  --green-900:#0B2E20; --green-800:#0E3A29; --green-700:#134634; --green-600:#1A5741;
  --gold:#C9A227; --gold-light:#E3C765; --gold-dark:#8F7318;
  --ink:#EAF2ED; --muted:#9DBBAC; --line:rgba(201,162,39,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--green-900);color:var(--ink);font-family:"Segoe UI","Tajawal",Tahoma,Arial,sans-serif;direction:rtl;min-height:100vh}
.wrap{max-width:1800px;margin:0 auto;padding:0 22px 60px}

/* الترويسة */
header{background:linear-gradient(135deg,var(--green-800),var(--green-700));border-bottom:3px solid var(--gold);
  padding:20px 26px;display:flex;align-items:center;gap:24px;position:relative;overflow:hidden}
header::after{content:"";position:absolute;inset:0;
  background-image:linear-gradient(45deg,rgba(201,162,39,.05) 25%,transparent 25%,transparent 75%,rgba(201,162,39,.05) 75%);
  background-size:70px 70px;pointer-events:none}
.brand{display:flex;flex-direction:column;align-items:center;gap:9px;z-index:1;width:300px}
.logo-box{display:flex;gap:18px;align-items:center}
.logo-box img{height:84px;width:auto;object-fit:contain;
  filter:drop-shadow(0 3px 10px rgba(0,0,0,.35))}
.brand-txt{font-size:12px;line-height:1.8;color:var(--gold-light);text-align:center;white-space:nowrap}
.brand-txt b{display:block;color:#fff;font-size:13px;margin-bottom:2px}
.brand-txt[contenteditable]:focus{outline:1px dashed var(--gold);border-radius:6px}
.spacer{width:300px}
.title-zone{flex:1;text-align:center;z-index:1}
.title-zone h1{font-size:27px;color:#fff;letter-spacing:.4px;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.title-zone .sub{margin-top:8px;display:inline-block;background:rgba(201,162,39,.16);border:1px solid var(--line);
  color:var(--gold-light);padding:5px 20px;border-radius:22px;font-size:13.5px}

/* أزرار الصالات */
nav.halls{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:26px 0 6px}
nav.halls button{background:linear-gradient(160deg,var(--green-700),var(--green-800));color:var(--ink);
  border:1.5px solid var(--line);border-radius:14px;padding:15px 34px;font-size:16px;font-weight:600;
  cursor:pointer;transition:.22s;font-family:inherit;min-width:200px}
nav.halls button:hover{border-color:var(--gold);transform:translateY(-2px)}
nav.halls button.on{background:linear-gradient(160deg,var(--gold),var(--gold-dark));color:#20180A;
  border-color:var(--gold-light);box-shadow:0 8px 24px rgba(201,162,39,.3)}

/* أزرار المناوبات */
nav.shifts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0 24px;
  padding:14px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:16px}
nav.shifts button{background:transparent;color:var(--muted);border:1.5px solid rgba(157,187,172,.25);
  border-radius:11px;padding:11px 26px;font-size:14.5px;cursor:pointer;transition:.2s;font-family:inherit}
nav.shifts button:hover{color:var(--gold-light);border-color:var(--line)}
nav.shifts button.on{background:var(--green-600);color:var(--gold-light);border-color:var(--gold);font-weight:600}

/* الأقسام */
.section{margin-bottom:34px}
.section-head{display:flex;align-items:center;gap:14px;margin-bottom:16px;padding:12px 20px;
  background:linear-gradient(90deg,var(--green-700),transparent);border-right:4px solid var(--gold);border-radius:0 12px 12px 0}
.section-head h2{font-size:19px;color:#fff}
.section-head .cnt{background:rgba(201,162,39,.18);color:var(--gold-light);padding:4px 14px;border-radius:14px;font-size:13px}

.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:1500px){.grid4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.grid4{grid-template-columns:1fr}}

.card{background:var(--green-800);border:1px solid var(--line);border-radius:15px;overflow:hidden;display:flex;flex-direction:column}
.card h3{padding:13px 16px;font-size:14.5px;text-align:center;color:#20180A;font-weight:700}
.c1 h3{background:linear-gradient(135deg,#8FBF7F,#5E9E4C)}
.c2 h3{background:linear-gradient(135deg,#8FC5E8,#4E90C0)}
.c3 h3{background:linear-gradient(135deg,#EDD07A,#D0AA33)}
.c4 h3{background:linear-gradient(135deg,#EFB08A,#D07E4E)}
.tbl-scroll{max-height:560px;overflow-y:auto}
.tbl-scroll::-webkit-scrollbar{width:8px}
.tbl-scroll::-webkit-scrollbar-track{background:var(--green-900)}
.tbl-scroll::-webkit-scrollbar-thumb{background:var(--gold-dark);border-radius:4px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{position:sticky;top:0;background:var(--green-700);color:var(--gold-light);padding:9px 7px;
  font-weight:600;font-size:11.5px;border-bottom:2px solid var(--line);white-space:nowrap}
tbody td{padding:8px 7px;border-bottom:1px solid rgba(157,187,172,.09)}
tbody tr:nth-child(even){background:rgba(255,255,255,.022)}
tbody tr:hover{background:rgba(201,162,39,.09)}
tbody tr.top3{background:rgba(201,162,39,.11)}
tbody tr.top3 td:first-child{color:var(--gold);font-weight:700}
.num{text-align:center;font-variant-numeric:tabular-nums}
.val{text-align:center;font-weight:700;color:var(--gold-light);font-variant-numeric:tabular-nums}
.nm{max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--muted);font-size:11.5px}

/* أفضل مناوبة */
.best-wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:8px}
@media(max-width:1300px){.best-wrap{grid-template-columns:1fr}}
.best-card{background:var(--green-800);border:1px solid var(--line);border-radius:16px;padding:20px}
.best-card h3{color:var(--gold-light);font-size:17px;margin-bottom:16px;text-align:center;
  padding-bottom:12px;border-bottom:1px solid var(--line)}
.shift-row{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.medal{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:14px;flex-shrink:0}
.m1{background:linear-gradient(135deg,#F5D76E,#C9A227);color:#20180A}
.m2{background:linear-gradient(135deg,#D8DDE3,#9BA5AE);color:#20180A}
.m3{background:linear-gradient(135deg,#D9A273,#A9744A);color:#20180A}
.m4{background:rgba(157,187,172,.18);color:var(--muted)}
.bar-zone{flex:1}
.bar-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bar-top b{color:#fff}
.bar-top span{color:var(--gold-light);font-weight:700}
.bar{height:9px;background:rgba(0,0,0,.28);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-dark),var(--gold-light));border-radius:5px}
.crit{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:7px;font-size:10.5px;color:var(--muted)}
.crit div{background:rgba(0,0,0,.2);border-radius:6px;padding:4px;text-align:center}
.crit b{display:block;color:var(--gold-light);font-size:11.5px;margin-top:2px}
.weights{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 0 22px}
.weights span{background:rgba(201,162,39,.13);border:1px solid var(--line);color:var(--gold-light);
  padding:7px 16px;border-radius:10px;font-size:13px}

.toolbar{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.toolbar input{background:var(--green-800);border:1.5px solid var(--line);color:var(--ink);
  padding:10px 18px;border-radius:11px;font-size:14px;font-family:inherit;width:300px}
.toolbar input:focus{outline:none;border-color:var(--gold)}
.toolbar button{background:var(--green-700);color:var(--gold-light);border:1.5px solid var(--line);
  padding:10px 20px;border-radius:11px;cursor:pointer;font-size:13.5px;font-family:inherit}
.toolbar button:hover{border-color:var(--gold)}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:36px;padding-top:18px;border-top:1px solid var(--line)}
.upload-zone{background:rgba(201,162,39,.08);border:1.5px dashed var(--gold);border-radius:14px;
  padding:16px 22px;margin:18px auto;max-width:900px;text-align:center}
.upload-zone label{background:linear-gradient(160deg,var(--gold),var(--gold-dark));color:#20180A;
  padding:11px 26px;border-radius:11px;cursor:pointer;font-weight:700;display:inline-block;font-size:14px}
.upload-zone p{color:var(--muted);font-size:12.5px;margin-top:10px;line-height:1.7}
#status{margin-top:10px;font-size:13px;color:var(--gold-light);min-height:18px}
@media print{nav,.toolbar,.upload-zone{display:none}body{background:#fff;color:#000}}

  const el = document.getElementById('hallNav');
  el.innerHTML = HALLS.map(h=>`<button data-h="${esc(h)}" class="${h===curHall?'on':''}">${esc(h)}</button>`).join('')
    + `<button data-h="__best" class="${curHall==='__best'?'on':''}">🏆 أفضل مناوبة</button>`;
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    curHall = b.dataset.h; curShift = null; render();
  });
}

function buildShiftNav(){
  const el = document.getElementById('shiftNav');
  if(curHall==='__best'){ el.style.display='none'; return; }
  el.style.display='flex';
  const avail = SHIFTS.filter(s=>DATA.data[curHall] && DATA.data[curHall][s]);
  if(!curShift || !avail.includes(curShift)) curShift = avail[0];
  el.innerHTML = avail.map(s=>`<button data-s="${esc(s)}" class="${s===curShift?'on':''}">${esc(s)}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{ curShift=b.dataset.s; render(); });
}

function tableHTML(rows, def){
  const sorted = rows.slice().sort((a,b)=> def.desc ? (b[def.k]-a[def.k] || b.prod-a.prod)
                                                    : (a[def.k]-b[def.k] || b.prod-a.prod));
  const body = sorted.map((e,i)=>{
    if(filter && !(e.name.includes(filter) || (!HIDE_ID && String(e.hid).includes(filter)))) return '';
    return `<tr class="${i<3?'top3':''}">
      <td class="num">${i+1}</td>
      <td class="nm" title="${esc(e.name)}">${esc(e.name)}</td>
      ${HIDE_ID ? '' : `<td class="num muted">${esc(e.hid)}</td>`}
      <td class="muted">${esc(e.rank)}</td>
      <td class="muted nm" title="${esc(e.sub)}">${esc(e.sub)}</td>
      <td class="val">${fmt(e[def.k])}</td></tr>`;
  }).join('');
  return `<div class="card ${def.c}"><h3>${def.t}</h3><div class="tbl-scroll"><table>
    <thead><tr><th>#</th><th>اسم الموظف</th>${HIDE_ID?'':'<th>رقم الهوية</th>'}<th>الرتبة</th><th>القسم الفرعي</th><th>${def.vh}</th></tr></thead>
    <tbody>${body||`<tr><td colspan="${HIDE_ID?5:6}" style="text-align:center;padding:26px" class="muted">لا توجد نتائج</td></tr>`}</tbody>
    </table></div></div>`;
}

function renderShift(){
  const secs = DATA.data[curHall][curShift];
  let html = '';
  ['القدوم','المغادرة'].forEach(sec=>{
    if(!secs[sec]) return;
    html += `<div class="section"><div class="section-head">
      <h2>قسم ${sec}</h2><span class="cnt">${secs[sec].length} موظفاً</span></div>
      <div class="grid4">${TABLES.map(d=>tableHTML(secs[sec], d)).join('')}</div></div>`;
  });
  return html;
}

function renderBest(){
  const byHall = {};
  DATA.best.forEach(r=>{ (byHall[r.hall] = byHall[r.hall]||[]).push(r); });
  const pct = v => (v*100).toFixed(1)+'%';
  let html = `<div class="weights">
      <span>الإنتاجية 40%</span><span>الغياب 30%</span><span>الأخطاء 20%</span><span>ضبط التزوير 10%</span>
    </div><div class="best-wrap">`;
  Object.keys(byHall).forEach(h=>{
    const rows = byHall[h].slice().sort((a,b)=>a.rank-b.rank);
    html += `<div class="best-card"><h3>${esc(h)}</h3>` + rows.map(r=>`
      <div class="shift-row">
        <div class="medal m${Math.min(r.rank,4)}">${r.rank}</div>
        <div class="bar-zone">
          <div class="bar-top"><b>${esc(r.shift)}</b><span>${pct(r.total)}</span></div>
          <div class="bar"><i style="width:${(r.total*100).toFixed(1)}%"></i></div>
          <div class="crit">
            <div>إنتاجية<b>${fmt(r.prod)}</b></div>
            <div>غياب<b>${r.ab}</b></div>
            <div>أخطاء<b>${r.err}</b></div>
            <div>ضبطيات<b>${r.fr}</b></div>
          </div>
        </div></div>`).join('') + `</div>`;
  });
  return html + '</div>';
}

function render(){
  buildHallNav(); buildShiftNav();
  const c = document.getElementById('content');
  document.getElementById('searchBox').style.display = (curHall==='__best') ? 'none' : '';
  c.innerHTML = (curHall==='__best') ? renderBest() : renderShift();
  document.getElementById('monthTag').textContent = 'شهر ' + DATA.month;
}

document.getElementById('q').addEventListener('input', e=>{ filter = e.target.value.trim(); render(); });
render();
</script>

</body></html>
